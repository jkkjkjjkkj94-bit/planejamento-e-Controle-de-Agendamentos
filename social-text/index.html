<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>Voz — Rede Social</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0b0d12;--line:#242b3a;--text:#f4f6fb;--muted:#9099aa;--accent:#7657ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.hidden{display:none!important}.app{max-width:760px;min-height:100vh;margin:auto;border-inline:1px solid var(--line)}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#0b0d12e8;border-bottom:1px solid var(--line)}.logo{font-size:23px;font-weight:900}.logo b{color:var(--accent)}.section{padding:20px;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}.stack{display:grid;gap:11px}.row{display:flex;gap:10px}.field{width:100%;border:1px solid var(--line);background:#0e131c;color:var(--text);padding:12px 14px;border-radius:14px;outline:0}textarea.field{min-height:105px}.btn{border:0;border-radius:999px;padding:10px 17px;background:var(--accent);color:white;font-weight:800;cursor:pointer}.btn.secondary{background:#1c2230}.notice{padding:11px 14px;border-radius:12px;background:#171d29}.error{color:#ff93a3}.composer footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.post{display:grid;grid-template-columns:45px 1fr;gap:12px;padding:20px;border-bottom:1px solid var(--line)}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#7657ff;font-weight:900}.meta{display:flex;gap:7px;flex-wrap:wrap}.name{font-weight:850}.handle,.date{font-size:14px;color:var(--muted)}.content{white-space:pre-wrap;line-height:1.55;margin:7px 0 12px}.action{border:0;background:transparent;color:var(--muted);padding:7px;cursor:pointer}.liked{color:#ff6c91}.empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:600px){.app{border:0}.row{flex-direction:column}}</style></head><body><div class="app"><header><div class="logo">V<b>o</b>z</div><button id="logout" class="btn secondary hidden">Sair</button></header><main id="auth" class="section"><h1>Uma rede social feita para palavras.</h1><p class="muted">Crie uma conta, publique textos e acompanhe as conversas.</p><div class="stack"><div class="row"><input id="email" class="field" type="email" placeholder="E-mail"><input id="password" class="field" type="password" minlength="6" placeholder="Senha"></div><div class="row"><input id="displayName" class="field" maxlength="60" placeholder="Nome"><input id="username" class="field" maxlength="24" placeholder="@usuario"></div><div class="row"><button id="register" class="btn">Criar conta</button><button id="login" class="btn secondary">Entrar</button></div><div id="authMessage" class="notice hidden"></div></div></main><main id="social" class="hidden"><section class="section composer"><strong id="welcome">Olá</strong><textarea id="postText" class="field" maxlength="500" placeholder="O que você quer compartilhar?"></textarea><footer><span id="counter" class="muted">0/500</span><button id="publish" class="btn">Publicar</button></footer></section><section id="feed"></section></main></div><script>const SUPABASE_URL='https://innziuzgtpfsiywqmies.supabase.co',SUPABASE_KEY='sb_publishable_fJB7zijdznI9ob9l9jSGlQ_6oU_J-d1',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let me=null,profile=null,channel=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function msg(t,e=false){let x=$('#authMessage');x.textContent=t;x.classList.remove('hidden');x.classList.toggle('error',e)}function clean(v){return v.toLowerCase().replace(/^@/,'').replace(/[^a-z0-9_.]/g,'').slice(0,24)}async function ensure(u,v={}){let {data,error}=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(error)throw error;if(data)return data;if(!v.username)return null;let username=clean(v.username);let r=await db.from('profiles').insert({id:u.id,username,display_name:v.displayName||username}).select().single();if(r.error)throw r.error;return r.data}async function register(){try{let email=$('#email').value.trim(),password=$('#password').value,displayName=$('#displayName').value.trim(),username=$('#username').value.trim();if(!email||password.length<6||!displayName||clean(username).length<3)return msg('Preencha e-mail, senha, nome e usuário.',true);let p={displayName,username};localStorage.setItem('voz_pending_profile',JSON.stringify(p));let {data,error}=await db.auth.signUp({email,password});if(error)throw error;if(data.session){profile=await ensure(data.user,p);localStorage.removeItem('voz_pending_profile');await start(data.user)}else msg('Conta criada. Confirme seu e-mail e depois entre.')}catch(e){msg(e.message,true)}}async function login(){try{let {data,error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)throw error;let p=JSON.parse(localStorage.getItem('voz_pending_profile')||'null');profile=await ensure(data.user,p||{});if(!profile)throw new Error('Perfil não encontrado.');localStorage.removeItem('voz_pending_profile');await start(data.user)}catch(e){msg(e.message,true)}}async function start(u){me=u;profile=profile||await ensure(u);if(!profile)return;$('#auth').classList.add('hidden');$('#social').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#welcome').textContent='Olá, '+profile.display_name;await feed();subscribe()}async function feed(){let {data,error}=await db.from('posts').select('id,user_id,content,created_at,profiles(username,display_name),likes(user_id)').order('created_at',{ascending:false}).limit(100);if(error){$('#feed').innerHTML='<div class="empty error">'+esc(error.message)+'</div>';return}if(!data?.length){$('#feed').innerHTML='<div class="empty">Nenhuma publicação ainda.</div>';return}$('#feed').innerHTML=data.map(p=>{let liked=p.likes?.some(x=>x.user_id===me.id),own=p.user_id===me.id,n=p.profiles?.display_name||'Usuário',h=p.profiles?.username||'usuario';return `<article class="post"><div class="avatar">${esc(n[0]?.toUpperCase()||'?')}</div><div><div class="meta"><span class="name">${esc(n)}</span><span class="handle">@${esc(h)}</span><span class="date">· ${new Date(p.created_at).toLocaleString('pt-BR')}</span></div><div class="content">${esc(p.content)}</div><button class="action ${liked?'liked':''}" onclick="like(${p.id},${liked})">♥ ${p.likes?.length||0}</button>${own?`<button class="action" onclick="del(${p.id})">Excluir</button>`:''}</div></article>`}).join('')}async function publish(){let content=$('#postText').value.trim();if(!content)return;let {error}=await db.from('posts').insert({user_id:me.id,content});if(error)return alert(error.message);$('#postText').value='';$('#counter').textContent='0/500';await feed()}async function like(id,liked){let q=liked?db.from('likes').delete().eq('post_id',id).eq('user_id',me.id):db.from('likes').insert({post_id:id,user_id:me.id});let {error}=await q;if(error)alert(error.message);else await feed()}async function del(id){if(!confirm('Excluir esta publicação?'))return;let {error}=await db.from('posts').delete().eq('id',id).eq('user_id',me.id);if(error)alert(error.message);else await feed()}function subscribe(){if(channel)return;channel=db.channel('voz-feed').on('postgres_changes',{event:'*',schema:'public',table:'posts'},feed).on('postgres_changes',{event:'*',schema:'public',table:'likes'},feed).subscribe()}$('#register').onclick=register;$('#login').onclick=login;$('#publish').onclick=publish;$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('#postText').oninput=e=>$('#counter').textContent=e.target.value.length+'/500';db.auth.getSession().then(async({data})=>{if(data.session){profile=await ensure(data.session.user);if(profile)await start(data.session.user)}});</script></body></html>
