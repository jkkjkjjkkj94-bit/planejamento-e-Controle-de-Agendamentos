<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voz — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090c11;--line:#242b39;--text:#f7f8fb;--muted:#929caf;--accent:#7352ff;--field:#10151e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{max-width:760px;min-height:100vh;margin:auto;border-inline:1px solid var(--line)}header{padding:18px 21px;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:900}.brand b{color:var(--accent)}.auth{padding:42px 20px}.tabs{display:flex;gap:7px;margin:24px 0}.tab,.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:800;cursor:pointer}.tab{background:#151b27;color:var(--muted)}.tab.active,.btn{background:var(--accent);color:#fff}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--text)}.notice{margin-top:12px;color:var(--muted)}.hidden{display:none!important}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="shell"><header><div class="brand">V<b>o</b>z</div></header><section class="auth"><h1 id="title">Entrar na Voz</h1><p id="subtitle">Entre com seu e-mail e senha para continuar.</p><div class="tabs"><button class="tab active" id="loginTab">Login</button><button class="tab" id="registerTab">Criar conta</button></div><form id="loginForm" class="form"><input id="loginEmail" class="field" type="email" placeholder="E-mail" required><input id="loginPassword" class="field" type="password" placeholder="Senha" minlength="6" required><button class="btn">Entrar</button></form><form id="registerForm" class="form hidden"><div class="row"><input id="displayName" class="field" placeholder="Nome" required><input id="username" class="field" placeholder="@usuario" required></div><input id="registerEmail" class="field" type="email" placeholder="E-mail" required><input id="registerPassword" class="field" type="password" minlength="6" placeholder="Senha (mínimo 6 caracteres)" required><button class="btn">Criar conta</button></form><div id="message" class="notice hidden"></div></section></div><script>const U='https://innziuzgtpfsiywqmies.supabase.co',K='sb_publishable_fJB7zijdznI9ob9l9jSGlQ_6oU_J-d1',db=supabase.createClient(U,K),$=s=>document.querySelector(s);function show(m){let l=m==='login';$('#loginTab').classList.toggle('active',l);$('#registerTab').classList.toggle('active',!l);$('#loginForm').classList.toggle('hidden',!l);$('#registerForm').classList.toggle('hidden',l);$('#title').textContent=l?'Entrar na Voz':'Criar sua conta';$('#subtitle').textContent=l?'Entre com seu e-mail e senha para continuar.':'Preencha seus dados para participar da Voz.'}function msg(t){$('#message').textContent=t;$('#message').classList.remove('hidden')}$('#loginTab').onclick=()=>show('login');$('#registerTab').onclick=()=>show('register');$('#loginForm').onsubmit=async e=>{e.preventDefault();let {error}=await db.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value});if(error)return msg(error.message);location.href='feed.html'};$('#registerForm').onsubmit=async e=>{e.preventDefault();let username=$('#username').value.trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9_.]/g,'');if(username.length<3)return msg('Usuário precisa ter pelo menos 3 caracteres.');let {data,error}=await db.auth.signUp({email:$('#registerEmail').value.trim(),password:$('#registerPassword').value,options:{data:{display_name:$('#displayName').value.trim(),username}}});if(error)return msg(error.message);msg(data.session?'Conta criada com sucesso.':'Conta criada. Confirme seu e-mail e depois faça login.')};</script></body></html>
