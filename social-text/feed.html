<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voz — Feed</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090c11;--line:#242b39;--text:#f7f8fb;--muted:#929caf;--accent:#7352ff;--field:#10151e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;border-inline:1px solid var(--line)}header{position:sticky;top:0;background:#090c11ee;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:900}.brand b{color:var(--accent)}button,textarea{font:inherit}.btn{border:0;border-radius:999px;padding:10px 17px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#1b2130}.composer,.post,.empty{padding:20px;border-bottom:1px solid var(--line)}.field{width:100%;min-height:100px;margin-top:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--text);resize:vertical}.composer footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.muted{color:var(--muted)}.post{display:grid;grid-template-columns:44px 1fr;gap:12px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);font-weight:900}.meta{display:flex;gap:7px;flex-wrap:wrap}.name{font-weight:800}.handle,.date{color:var(--muted);font-size:14px}.content{white-space:pre-wrap;line-height:1.55;margin:8px 0}.action{border:0;background:transparent;color:var(--muted);padding:7px;cursor:pointer}.liked{color:#ff6c91}.hidden{display:none!important}</style></head><body><div class="app"><header><div class="brand">V<b>o</b>z</div><button id="logout" class="btn secondary">Sair</button></header><section class="composer"><strong id="welcome">Voz</strong><textarea id="text" class="field" maxlength="500" placeholder="O que você quer compartilhar?"></textarea><footer><span id="counter" class="muted">0/500</span><button id="publish" class="btn">Publicar</button></footer></section><section id="feed"></section></div><script>const U='https://innziuzgtpfsiywqmies.supabase.co',K='sb_publishable_fJB7zijdznI9ob9l9jSGlQ_6oU_J-d1',db=supabase.createClient(U,K),$=s=>document.querySelector(s);let me,profile,channel;const esc=s=>String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function init(){let {data:{session}}=await db.auth.getSession();if(!session)return location.replace('./');me=session.user;let r=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();profile=r.data;if(!profile){profile={display_name:me.user_metadata?.display_name||me.email.split('@')[0],username:me.user_metadata?.username||me.email.split('@')[0]}}$('#welcome').textContent='Olá, '+profile.display_name;await load();subscribe()}async function load(){let {data,error}=await db.from('posts').select('id,user_id,content,created_at,profiles(username,display_name),likes(user_id)').order('created_at',{ascending:false}).limit(100);if(error)return $('#feed').innerHTML='<div class="empty">'+esc(error.message)+'</div>';if(!data?.length)return $('#feed').innerHTML='<div class="empty muted">Nenhuma publicação ainda. Escreva a primeira.</div>';$('#feed').innerHTML=data.map(p=>{let liked=p.likes?.some(l=>l.user_id===me.id),own=p.user_id===me.id,n=p.profiles?.display_name||'Usuário',h=p.profiles?.username||'usuario';return `<article class="post"><div class="avatar">${esc(n[0]?.toUpperCase()||'?')}</div><div><div class="meta"><span class="name">${esc(n)}</span><span class="handle">@${esc(h)}</span><span class="date">· ${new Date(p.created_at).toLocaleString('pt-BR')}</span></div><div class="content">${esc(p.content)}</div><button class="action ${liked?'liked':''}" onclick="likePost(${p.id},${liked})">♥ ${p.likes?.length||0}</button>${own?`<button class="action" onclick="removePost(${p.id})">Excluir</button>`:''}</div></article>`}).join('')}async function publish(){let content=$('#text').value.trim();if(!content)return;let {error}=await db.from('posts').insert({user_id:me.id,content});if(error)return alert(error.message);$('#text').value='';$('#counter').textContent='0/500';await load()}async function likePost(id,liked){let q=liked?db.from('likes').delete().eq('post_id',id).eq('user_id',me.id):db.from('likes').insert({post_id:id,user_id:me.id});let {error}=await q;if(error)alert(error.message);else await load()}async function removePost(id){if(!confirm('Excluir esta publicação?'))return;let {error}=await db.from('posts').delete().eq('id',id).eq('user_id',me.id);if(error)alert(error.message);else await load()}function subscribe(){channel=db.channel('voz-feed').on('postgres_changes',{event:'*',schema:'public',table:'posts'},load).on('postgres_changes',{event:'*',schema:'public',table:'likes'},load).subscribe()}$('#publish').onclick=publish;$('#text').oninput=e=>$('#counter').textContent=e.target.value.length+'/500';$('#logout').onclick=async()=>{await db.auth.signOut();location.replace('./')};init();</script></body></html>
